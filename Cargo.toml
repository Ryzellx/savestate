[package]
name = "savestate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline-first universal game save backup and restoration manager"
homepage = "https://github.com/ryzellx/savestate"
repository = "https://github.com/ryzellx/savestate"
authors = ["SaveState Contributors"]
keywords = ["games", "backup", "saves", "desktop"]
categories = ["command-line-utilities"]

[lib]
name = "savestate"
path = "src/lib.rs"

[[bin]]
name = "savestate"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
walkdir = "2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
