name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: savestate
            archive: savestate-linux-x86_64.tar.gz
          - os: windows-latest
            binary: savestate.exe
            archive: savestate-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libx11-dev pkg-config
      - run: cargo build --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C target/release savestate README.md LICENSE CHANGELOG.md
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/savestate.exe, README.md, LICENSE, CHANGELOG.md -DestinationPath ${{ matrix.archive }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
